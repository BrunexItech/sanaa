services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ushanga
      POSTGRES_PASSWORD: ushanga
      POSTGRES_DB: ushanga
    ports:
      - "5436:5432"
    volumes:
      - ushanga_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ushanga"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://ushanga:ushanga@postgres:5432/ushanga
      NODE_ENV: production
      SITE_URL: ${SITE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && npm run start"

volumes:
  ushanga_postgres_data:
